name: 不具合 / Bug report / Ошибка
description: 動作の問題を報告 / Report a problem / Сообщить об ошибке
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        投稿は公開されます。秘密情報・アカウントID・未加工のログは記載しないでください。
        Posts are public. Do not include secrets, account IDs or raw logs.
        Сообщение публично. Не указывайте секретные данные, ID аккаунта и необработанные журналы.
  - type: input
    id: version
    attributes:
      label: クライアントの版 / Client version / Версия клиента
      description: 分からなければ「不明」で構いません / Unknown is OK.
  - type: dropdown
    id: language
    attributes:
      label: ゲームの言語 / Game language / Язык игры
      options:
        - 日本語
        - English
        - Русский
        - 不明 / Unknown
  - type: input
    id: environment
    attributes:
      label: Windows・GPU / Windows and GPU / Windows и видеокарта
  - type: input
    id: occurred_at
    attributes:
      label: 発生日時・タイムゾーン / Time and time zone / Время и часовой пояс
  - type: textarea
    id: match_context
    attributes:
      label: 対戦・起動状況 / Match or launch context / Матч или запуск
      description: ソロ・パーティ人数、モード、マップ、待機時間、エラー文・ポート番号 / Solo or party size, mode, map, wait time, error and port / Размер группы, режим, карта, время ожидания, ошибка и порт.
  - type: textarea
    id: problem
    attributes:
      label: 症状と操作 / Problem and steps / Проблема и действия
      description: 期待した動作と実際の動作を教えてください / Describe expected and actual behavior.
    validations:
      required: true
